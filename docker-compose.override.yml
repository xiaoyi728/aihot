# 本地部署覆盖：只加构建参数，让 npm / apt 走国内镜像。
# 用法：docker compose up -d --build
services:
  setup:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
  api:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
  worker:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
  web:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}